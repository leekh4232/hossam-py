[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hossam"
version = "0.5.35"
description = "Hossam Data Helper"
readme = "README.md"
requires-python = ">=3.12.0"
authors = [{ name = "Lee Kwang-Ho", email = "leekh4232@gmail.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = ["data", "analysis", "helper", "hossam", "scikit-learn", "pandas", "numpy", "matplotlib", "seaborn", "plotly"]
dependencies = [
    "jupyter",
    "tqdm",
    "pyarrow",
    "tabulate",
    "numpy",
    "pandas",
    "scipy",
    "joblib",
    "scikit-learn",
    "statsmodels",
    "requests",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "xlrd",
    "pingouin",
    "statannotations",
    "xgboost",
    "lightgbm",
    "catboost",
    "shap",
    "geopandas",
    "libpysal",
    "esda",
    "kneed",
]

[project.optional-dependencies]
# make_api_docs() 로 API 레퍼런스 문서를 생성할 때만 필요한 패키지
# (설치되어 있지 않으면 make_api_docs() 가 실행 시점에 자동으로 설치한다)
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[project.urls]
Homepage = "https://github.com/leekh4232/hossam-py"
Youtube = "https://www.youtube.com/@hossam-codingclub"
Repository = "https://github.com/leekh4232/hossam-py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hossam", "hossam.*"]

[tool.setuptools.package-data]
hossam = ["*.ttf", "*.png", "config.toml", "_fingerprints/*.json"]
